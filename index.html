<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calendario de Aseos · Jóvenes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --bg:#0b0f1a;
      --card:#111827;
      --pink:#ec4899;
      --purple:#8b5cf6;
      --blue:#38bdf8;
      --green:#22c55e;
      --text:#e5e7eb;
      --muted:#9ca3af;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:'Poppins','Segoe UI',system-ui,sans-serif;
      background:radial-gradient(circle at top, #111827, var(--bg));
      color:var(--text);
      min-height:100vh;
      padding:20px;
    }

    h1{
      text-align:center;
      font-size:2.5rem;
      margin-bottom:5px;
      background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      text-align:center;
      color:var(--muted);
      margin-bottom:35px;
      font-size:1rem;
    }

    .calendar{
      max-width:1100px;
      margin:0 auto;
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(210px,1fr));
      gap:22px;
    }

    .month{
      background:linear-gradient(160deg,#b42815,#150bad);
      border-radius:22px;
      padding:22px;
      position:relative;
      cursor:pointer;
      overflow:hidden;
      transition:.35s cubic-bezier(.4,0,.2,1);
    }

    .month::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, transparent, rgba(10, 107, 253, 0.18), transparent);
      opacity:0;
      transition:.35s;
    }

    .month:hover::before{opacity:1}

    .month:hover{
      transform:translateY(-10px) rotate(-1deg) scale(1.04);
      box-shadow:0 25px 60px rgba(6, 197, 255, 0.35);
    }

    .month h2{
      margin:0 0 10px;
      font-size:1.4rem;
    }

    .chip{
      display:inline-block;
      padding:6px 14px;
      border-radius:999px;
      font-size:.8rem;
      background:rgba(139,92,246,.2);
      color:#c4b5fd;
    }

    .inactive{
      opacity:.3;
      cursor:not-allowed;
    }

    .inactive:hover{
      transform:none;
      box-shadow:none;
    }

    /* MODAL */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(1, 1, 3, 0.699);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
    }

    .modal-card{
      background:linear-gradient(160deg,#040b77,#0a1120);
      border-radius:26px;
      padding:32px;
      max-width:420px;
      width:90%;
      animation:bounce .4s ease;
      box-shadow:0 40px 90px rgba(255, 1, 1, 0.555);
    }

    @keyframes bounce{
      from{transform:scale(.8) rotate(-2deg); opacity:0}
      to{transform:scale(1) rotate(0); opacity:1}
    }

    .close{
      float:right;
      cursor:pointer;
      font-size:1.3rem;
      color:var(--muted);
    }

    .tag{
      display:inline-block;
      margin:10px 0;
      padding:8px 16px;
      border-radius:14px;
      background:rgba(34,197,94,.2);
      color:#86efac;
      font-weight:600;
    }

    ul{padding-left:20px}
    li{margin:6px 0}

    footer{
      text-align:center;
      margin-top:40px;
      color:var(--muted);
      font-size:.85rem;
    }
  </style>
</head>
<body>

<h1>🧼 Aseos Jóvenes JOFAD 2026</h1>
<p class="subtitle">Toca un mes 👇 mira a quién le toca limpiar ✨</p>

<div class="calendar" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-card">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<footer>
  💡 Segundo sábado de cada mes· Agosto y Diciembre descansamos
</footer>

<script>
const groups = {
  1:['Gerson Mateo','Daniela','Nikcia'],
  2:['Haniel','Sahori','Sandy'],
  3:['Yasir','Lesdy','Samir'],
  4:['Ludim','Héctor','Salvador']
};

const months = [
  {name:'Febrero', date:'14 feb 2026', group:1},
  {name:'Marzo', date:'14 mar 2026', group:2},
  {name:'Abril', date:'11 abr 2026', group:3},
  {name:'Mayo', date:'9 may 2026', group:4},
  {name:'Junio', date:'13 jun 2026', group:1},
  {name:'Julio', date:'11 jul 2026', group:2},
  {name:'Agosto', inactive:true},
  {name:'Septiembre', date:'12 sep 2026', group:3},
  {name:'Octubre', date:'10 oct 2026', group:4},
  {name:'Noviembre', date:'14 nov 2026', group:1},
  {name:'Diciembre', inactive:true}
];

const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');

months.forEach(m=>{
  const card=document.createElement('div');
  card.className='month'+(m.inactive?' inactive':'');
  card.innerHTML=`<h2>${m.name}</h2>${m.inactive?'<span class="chip">😴 Descanso</span>':`<span class="chip">🔥 Grupo ${m.group}</span>`}`;
  if(!m.inactive) card.onclick=()=>openModal(m);
  calendar.appendChild(card);
});

function openModal(m){
  modal.style.display='flex';
  modalBody.innerHTML=`
    <h2>${m.name}</h2>
    <p>📅 <strong>${m.date}</strong></p>
    <span class="tag">Grupo ${m.group}</span>
    <ul>${groups[m.group].map(p=>`<li>👤 ${p}</li>`).join('')}</ul>
  `;
}

function closeModal(){modal.style.display='none'}
modal.onclick=e=>{if(e.target===modal)closeModal()}
</script>

</body>
</html>
